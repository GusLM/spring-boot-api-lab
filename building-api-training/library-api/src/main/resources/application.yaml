spring:
  application:
    name: library-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER_CLASS_NAME}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            # Credenciais usadas pelo Spring Security para iniciar o login social com Google.
            client-id: ${SOCIAL_CLIENT_ID}
            client-secret: ${SOCIAL_CLIENT_SECRET}
