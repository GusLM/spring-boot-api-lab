<!DOCTYPE html>
<html lang="pt-BR" xmls:th="http://www.thymeleaf.org" xmlns:xmls="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --spring: #6db33f;
      --spring-dark: #4b8a2a;
      --leaf: #a8d08d;
      --graphite: #1b1f1c;
      --panel: #23281f;
      --line: rgba(109,179,63,0.25);
    }

    *{ box-sizing: border-box; }

    body{
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background:
              radial-gradient(700px 400px at 50% -10%, rgba(109,179,63,0.18) 0%, transparent 60%),
              var(--graphite);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card-login{
      width: 100%;
      max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px 34px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
    }

    .brand{
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .brand .leaf{
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--spring);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand .leaf svg{
      width: 18px;
      height: 18px;
    }

    .brand span{
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.05rem;
      color: #f2f5ef;
      letter-spacing: -0.02em;
    }

    .brand span b{
      color: var(--spring);
      font-weight: 700;
    }

    h1.title{
      font-size: 1.3rem;
      font-weight: 600;
      color: #f2f5ef;
      margin: 0 0 4px;
    }

    .subtitle{
      font-size: 0.85rem;
      color: #8b968a;
      margin-bottom: 26px;
    }

    .form-label{
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--leaf);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .form-control{
      background: #181c15;
      border: 1px solid rgba(255,255,255,0.08);
      color: #f2f5ef;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .form-control::placeholder{
      color: #5a6157;
    }

    .form-control:focus{
      background: #181c15;
      color: #f2f5ef;
      border-color: var(--spring);
      box-shadow: 0 0 0 3px rgba(109,179,63,0.2);
    }

    .btn-spring{
      background: var(--spring);
      border: none;
      color: #10250a;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-top: 8px;
      transition: background .2s ease, transform .15s ease;
    }

    .btn-spring:hover{
      background: var(--spring-dark);
      color: #fff;
      transform: translateY(-1px);
    }

    /* Botão Google */

    .btn-google{
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      background: #181c15;
      border: 1px solid rgba(255,255,255,0.12);
      color: #f2f5ef;

      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;

      text-decoration: none;

      transition:
              background .2s ease,
              border-color .2s ease,
              transform .15s ease;
    }

    .btn-google:hover{
      background: #20251d;
      border-color: rgba(255,255,255,0.22);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-google svg{
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .divider{
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #5a6157;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .divider::before,
    .divider::after{
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    .foot-note{
      text-align: center;
      font-size: 0.72rem;
      color: #5a6157;
      margin-top: 22px;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>

<body>

<div class="card-login">

  <div class="brand">
    <span class="leaf">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 4C10 4 4 10 4 18c0 1 .05 1.6.15 2C10.5 13.5 16 10.5 20 8c-4.3 3-9 6.5-14.6 10.6C6.9 19.7 8.5 20 10 20c8 0 14-6 14-16 0 0-.6 0-4 0z"
              fill="#10250a"/>
      </svg>
    </span>

    <span><b>spring</b>boot</span>
  </div>

  <h1 class="title">Acessar aplicação</h1>
  <p class="subtitle">Informe as suas credenciais para continuar.</p>

  <form method="POST" th:action="@{/login}">

    <div class="mb-3">
      <label class="form-label" for="username">Usuário</label>
      <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="usuário"
              required>
    </div>

    <div class="mb-2">
      <label class="form-label" for="password">Senha</label>
      <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="••••••••"
              required>
    </div>

    <button type="submit" class="btn btn-spring w-100">
      Entrar
    </button>

  </form>

  <div class="divider">
    OU
  </div>

  <!-- Login com Google via Spring Security OAuth2 -->
  <a
          th:href="@{/oauth2/authorization/google}"
          href="/oauth2/authorization/google"
          class="btn-google">

    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path
              d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"
              fill="#4285F4"/>

      <path
              d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.28v2.53A9.74 9.74 0 0 0 12 21.5z"
              fill="#34A853"/>

      <path
              d="M6.53 13.59A5.86 5.86 0 0 1 6.22 12c0-.55.1-1.09.31-1.59V7.88H3.28A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.06 1.03 4.12l3.25-2.53z"
              fill="#FBBC05"/>

      <path
              d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.48 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.72 5.38l3.25 2.53C7.3 8.1 9.46 6.38 12 6.38z"
              fill="#EA4335"/>
    </svg>

    Continuar com Google

  </a>

  <p class="foot-note">// spring-security · v1.0</p>

</div>

</body>
</html>
```
